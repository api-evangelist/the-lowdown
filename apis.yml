name: The Lowdown
description: >-
  The Lowdown is the UK's leading community-driven reproductive and sexual
  health platform for women, founded in 2019 by Alice Pelton. It enables people
  to review and research their health conditions, symptoms and medications so
  they can make more informed decisions, starting with contraception and
  expanding into menopause, fertility, PCOS, endometriosis, periods and weight
  care. The platform combines scientific information with a unique dataset of
  thousands of community reviews and hundreds of thousands of data points on
  lived experience across dozens of contraceptive methods and brands, alongside
  medical advice and online prescriptions. It is free to use, monetising through
  partnerships with the NHS, women's health innovators and clinical trial
  recruitment. The Lowdown was surfaced as a portfolio company of Speedinvest
  and added to the API Evangelist network for enrichment; it is a consumer web
  platform and currently exposes no public API or developer program.
